upstream boxit_web {
    server web:3000;
}

upstream boxit_api {
    server api:3001;
}

server {
    listen 80;
    server_name _;

    # Tamaño de subida (por si sumamos avatares/fotos más adelante)
    client_max_body_size 5m;

    # API — la API tiene prefijo global /api, así que preservamos el path
    location /api/ {
        proxy_pass http://boxit_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Front (Next.js) + assets de la PWA
    location / {
        proxy_pass http://boxit_web;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Para TLS (Fase de deploy), agregar un server { listen 443 ssl; ... } con certbot.
